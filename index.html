<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaStore - Ambiente de Testes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag-lab {
      font-size: 0.75rem;
      background-color: var(--border);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    input, select {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .img-wrapper {
      height: 160px;
      background-color: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      user-select: none;
    }

    .info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category {
      font-size: 0.75rem;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .price-container {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .price-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .price-value-box {
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
    }

    .currency {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
    }

    /* SELETOR PRINCIPAL PARA O N8N */
    .product-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-buy {
      margin-top: 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-buy:hover {
      background-color: var(--primary-hover);
    }

    .pagination {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-page {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-page.active {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      🏬 MegaStore
      <span class="tag-lab">Ambiente de Testes</span>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Buscar qualquer produto...">
      <select id="category-filter">
        <option value="all">Todas as Categorias (30)</option>
        <option value="Tecnologia">Tecnologia (10)</option>
        <option value="Casa & Cozinha">Casa & Cozinha (10)</option>
        <option value="Beleza & Cuidado">Beleza & Cuidado (10)</option>
      </select>
    </div>
  </header>

  <main>
    <div class="grid" id="product-grid"></div>
    <div class="pagination" id="pagination-controls"></div>
  </main>

  <footer>
    <p>MegaStore Mock E-commerce • Base de dados para minicursos de raspagem e automação.</p>
  </footer>

  <script>
    // 30 PRODUTOS (10 Tech, 10 Casa, 10 Beleza)
    const products = [
      // --- TECNOLOGIA (1-10) ---
      { id: 1, name: "PlayStation 5 Slim 1TB", category: "Tecnologia", price: "3499.00", icon: "🎮" },
      { id: 2, name: "Xbox Series X 1TB", category: "Tecnologia", price: "4199.00", icon: "🎮" },
      { id: 3, name: "Nintendo Switch OLED 64GB", category: "Tecnologia", price: "2100.00", icon: "🕹️" },
      { id: 4, name: "iPhone 15 128GB Preto", category: "Tecnologia", price: "4899.00", icon: "📱" },
      { id: 5, name: "Samsung Galaxy S24 Ultra", category: "Tecnologia", price: "6499.00", icon: "📱" },
      { id: 6, name: "Placa de Vídeo RTX 4070 12GB", category: "Tecnologia", price: "3899.00", icon: "📟" },
      { id: 7, name: "Processador AMD Ryzen 7 5700X", category: "Tecnologia", price: "1150.00", icon: "🔲" },
      { id: 8, name: "Monitor Gamer 27 165Hz IPS", category: "Tecnologia", price: "1299.00", icon: "🖥️" },
      { id: 9, name: "Teclado Mecânico RGB Switch Red", category: "Tecnologia", price: "349.00", icon: "⌨️" },
      { id: 10, name: "Fone Headphone ANC Bluetooth", category: "Tecnologia", price: "599.00", icon: "🎧" },

      // --- CASA & COZINHA (11-20) ---
      { id: 11, name: "Fritadeira Air Fryer Digital 4L", category: "Casa & Cozinha", price: "389.90", icon: "🍟" },
      { id: 12, name: "Robô Aspirador de Pó Inteligente", category: "Casa & Cozinha", price: "1250.00", icon: "🤖" },
      { id: 13, name: "Cafeteira Nespresso Essenza Mini", category: "Casa & Cozinha", price: "469.00", icon: "☕" },
      { id: 14, name: "Panela de Pressão Elétrica 5L", category: "Casa & Cozinha", price: "429.00", icon: "🍲" },
      { id: 15, name: "Liquidificador Blender 1200W", category: "Casa & Cozinha", price: "249.90", icon: "🥤" },
      { id: 16, name: "Jogo de Panelas Cerâmica 5 Peças", category: "Casa & Cozinha", price: "599.00", icon: "🍳" },
      { id: 17, name: "Purificador de Água Gelada e Natural", category: "Casa & Cozinha", price: "689.00", icon: "🚰" },
      { id: 18, name: "Jogo de Cama Queen 300 Fios", category: "Casa & Cozinha", price: "289.00", icon: "🛏️" },
      { id: 19, name: "Lâmpada Inteligente Wi-Fi RGB", category: "Casa & Cozinha", price: "69.90", icon: "💡" },
      { id: 20, name: "Umidificador e Aromatizador Ultrassônico", category: "Casa & Cozinha", price: "119.00", icon: "💨" },

      // --- BELEZA & CUIDADO (21-30) ---
      { id: 21, name: "Secador de Cabelo Iônico 2200W", category: "Beleza & Cuidado", price: "279.00", icon: "💨" },
      { id: 22, name: "Escova Rotativa e Secadora 4 em 1", category: "Beleza & Cuidado", price: "189.90", icon: "💇‍♀️" },
      { id: 23, name: "Modelador de Cachos Automático", category: "Beleza & Cuidado", price: "349.00", icon: "✨" },
      { id: 24, name: "Máquina de Cortar Cabelo Profissional", category: "Beleza & Cuidado", price: "169.00", icon: "✂️" },
      { id: 25, name: "Barbeador Elétrico Recarregável 3D", category: "Beleza & Cuidado", price: "219.90", icon: "🪒" },
      { id: 26, name: "Perfume Importado Eau de Parfum 100ml", category: "Beleza & Cuidado", price: "549.00", icon: "🧴" },
      { id: 27, name: "Kit Sérum Facial Vitamina C e Ácido Hialurônico", category: "Beleza & Cuidado", price: "139.90", icon: "💧" },
      { id: 28, name: "Protetor Solar Facial Fluido FPS 70", category: "Beleza & Cuidado", price: "79.90", icon: "☀️" },
      { id: 29, name: "Escova de Dentes Elétrica Sônica", category: "Beleza & Cuidado", price: "159.00", icon: "🪥" },
      { id: 30, name: "Balnaça Digital de Bioimpedância", category: "Beleza & Cuidado", price: "129.00", icon: "⚖️" }
    ];

    const ITEMS_PER_PAGE = 10;
    let currentPage = 1;
    let filteredProducts = [...products];

    const productGrid = document.getElementById("product-grid");
    const paginationControls = document.getElementById("pagination-controls");
    const searchInput = document.getElementById("search-input");
    const categoryFilter = document.getElementById("category-filter");

    function renderProducts() {
      productGrid.innerHTML = "";
      
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = filteredProducts.slice(start, end);

      if (pageItems.length === 0) {
        productGrid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;'>Nenhum produto encontrado com os filtros selecionados.</p>";
        paginationControls.innerHTML = "";
        return;
      }

      pageItems.forEach(prod => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.id = `produto-${prod.id}`;
        card.innerHTML = `
          <div class="img-wrapper">${prod.icon}</div>
          <div class="info">
            <span class="category">${prod.category}</span>
            <h3 class="product-title">${prod.name}</h3>
            <div class="price-container">
              <div class="price-label">Valor à vista:</div>
              <div class="price-value-box">
                <span class="currency">R$</span>
                <span class="product-price">${prod.price}</span>
              </div>
            </div>
            <button class="btn-buy">Comprar</button>
          </div>
        `;
        productGrid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      paginationControls.innerHTML = "";
      const totalPages = Math.ceil(filteredProducts.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `btn-page ${i === currentPage ? "active" : ""}`;
        btn.textContent = i;
        btn.addEventListener("click", () => {
          currentPage = i;
          renderProducts();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        paginationControls.appendChild(btn);
      }
    }

    function filterData() {
      const searchTerm = searchInput.value.toLowerCase();
      const selectedCategory = categoryFilter.value;

      filteredProducts = products.filter(p => {
        const matchesName = p.name.toLowerCase().includes(searchTerm);
        const matchesCategory = selectedCategory === "all" || p.category === selectedCategory;
        return matchesName && matchesCategory;
      });

      currentPage = 1;
      renderProducts();
    }

    searchInput.addEventListener("input", filterData);
    categoryFilter.addEventListener("change", filterData);

    // Inicialização
    renderProducts();
  </script>
</body>
</html>
