<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaStore - Ambiente de Testes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .tag-lab { font-size: 0.75rem; background-color: var(--border); color: var(--text-muted); padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase; }
    .controls { display: flex; gap: 1rem; flex-wrap: wrap; }
    input, select { background-color: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem 1rem; border-radius: 6px; outline: none; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 1.5rem; 
    }
    
    .product-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s ease; }
    .product-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .img-wrapper { height: 160px; background-color: #0b1120; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; user-select: none; }
    .info { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .category { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; font-weight: 600; margin-bottom: 0.5rem; }
    .product-title { font-size: 1.05rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.75rem; }
    .price-container { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    .price-label { font-size: 0.8rem; color: var(--text-muted); }
    .currency { color: var(--accent); font-weight: 600; }
    .product-price { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .btn-detail { margin-top: 1rem; background-color: var(--primary); color: white; text-decoration: none; text-align: center; padding: 0.6rem; border-radius: 6px; font-weight: 600; display: block; }
    .btn-detail:hover { background-color: var(--primary-hover); }
    .pagination { margin-top: 2.5rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    .btn-page { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-page.active { background-color: var(--primary); border-color: var(--primary); }
    footer { background-color: var(--card-bg); border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      🏬 MegaStore
      <span class="tag-lab">Ambiente de Testes</span>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Buscar produto...">
      <select id="category-filter">
        <option value="all">Todas as Categorias</option>
        <option value="Tecnologia">Tecnologia</option>
        <option value="Casa & Cozinha">Casa & Cozinha</option>
        <option value="Beleza & Cuidado">Beleza & Cuidado</option>
      </select>
    </div>
  </header>

  <main>
    <div class="grid" id="product-grid">Carregando produtos...</div>
    <div class="pagination" id="pagination-controls"></div>
  </main>

  <footer>
    <p>MegaStore Mock E-commerce • Gerado via produtos.json</p>
  </footer>

  <script>
    const MAX_ROWS = 3; // Limite fixo de 3 linhas de produtos
    let currentPage = 1;
    let products = [];
    let filteredProducts = [];

    const productGrid = document.getElementById("product-grid");
    const paginationControls = document.getElementById("pagination-controls");
    const searchInput = document.getElementById("search-input");
    const categoryFilter = document.getElementById("category-filter");

    // Calcula quantos itens cabem na página baseado no número de colunas (máx 3 linhas)
    function getItemsPerPage() {
      const gridWidth = productGrid.clientWidth;
      const minCardWidth = 260; // Largura mínima do card definida no CSS
      const gap = 24; // 1.5rem = 24px
      
      const columns = Math.max(1, Math.floor((gridWidth + gap) / (minCardWidth + gap)));
      return columns * MAX_ROWS;
    }

    async function loadData() {
      try {
        const res = await fetch('./produtos.json');
        products = await res.json();
        filteredProducts = [...products];
        renderProducts();
      } catch (err) {
        productGrid.innerHTML = "<p>Erro ao carregar o catálogo de produtos.</p>";
      }
    }

    function renderProducts() {
      productGrid.innerHTML = "";
      const itemsPerPage = getItemsPerPage();
      const totalPages = Math.ceil(filteredProducts.length / itemsPerPage) || 1;

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const pageItems = filteredProducts.slice(start, start + itemsPerPage);

      if (pageItems.length === 0) {
        productGrid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;'>Nenhum produto encontrado.</p>";
        paginationControls.innerHTML = "";
        return;
      }

      pageItems.forEach(prod => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="img-wrapper">${prod.icon}</div>
          <div class="info">
            <span class="category">${prod.category}</span>
            <h3 class="product-title">${prod.name}</h3>
            <div class="price-container">
              <div class="price-label">A partir de:</div>
              <span class="currency">R$</span> <span class="product-price">${prod.price}</span>
            </div>
            <a href="produtos/${prod.id}.html" class="btn-detail">Ver Detalhes</a>
          </div>
        `;
        productGrid.appendChild(card);
      });

      renderPagination(itemsPerPage);
    }

    function renderPagination(itemsPerPage) {
      paginationControls.innerHTML = "";
      const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `btn-page ${i === currentPage ? "active" : ""}`;
        btn.textContent = i;
        btn.onclick = () => { 
          currentPage = i; 
          renderProducts(); 
          window.scrollTo({ top: 0, behavior: 'smooth' }); 
        };
        paginationControls.appendChild(btn);
      }
    }

    function filterData() {
      const term = searchInput.value.toLowerCase();
      const cat = categoryFilter.value;
      filteredProducts = products.filter(p => 
        p.name.toLowerCase().includes(term) && (cat === "all" || p.category === cat)
      );
      currentPage = 1;
      renderProducts();
    }

    searchInput.addEventListener("input", filterData);
    categoryFilter.addEventListener("change", filterData);

    // Recalcula a paginação ao redimensionar a tela
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderProducts();
      }, 100);
    });

    loadData();
  </script>
</body>
</html>
