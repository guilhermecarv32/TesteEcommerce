<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balança Digital de Bioimpedância - MegaStore</title>
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #6366f1; --accent: #22c55e; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    .nav-back { display: inline-block; color: var(--muted); text-decoration: none; margin-bottom: 1.5rem; }
    .product-detail { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; display: grid; grid-template-columns: 1fr 1.3fr; gap: 2.5rem; }
    @media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; padding: 1.5rem; } }
    .product-image { background-color: #0b1120; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 5rem; min-height: 250px; }
    .badge { display: inline-block; font-size: 0.75rem; background: var(--border); color: var(--primary); padding: 0.25rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: bold; margin-bottom: 0.75rem; }
    .product-title { font-size: 1.6rem; margin-bottom: 1rem; line-height: 1.3; }
    .description { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .price-box { background-color: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .price-label { font-size: 0.8rem; color: var(--muted); }
    .price-row { display: flex; align-items: baseline; gap: 0.4rem; margin-top: 0.25rem; }
    .currency { color: var(--accent); font-size: 1.2rem; font-weight: bold; }
    .product-price { font-size: 2.2rem; font-weight: bold; color: var(--accent); }
    .btn-buy { background-color: var(--primary); color: white; border: none; padding: 0.9rem; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="nav-back">← Voltar para o Catálogo</a>
    <div class="product-detail">
      <div class="product-image">⚖️</div>
      <div class="product-info">
        <span class="badge">Beleza & Cuidado</span>
        <h1 class="product-title">Balança Digital de Bioimpedância</h1>
        <p class="description">Balança com conexão Bluetooth e medição de gordura corporal.</p>
        <div class="price-box">
          <div class="price-label">Preço à vista com desconto:</div>
          <div class="price-row">
            <span class="currency">R$</span>
            <span class="product-price">129.00</span>
          </div>
        </div>
        <button class="btn-buy">Comprar Agora</button>
      </div>
    </div>
  </div>
</body>
</html>
